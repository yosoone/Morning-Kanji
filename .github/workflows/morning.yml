name: Morning page

on:
  schedule:
    # GitHub can delay or drop scheduled runs, so try every hour from 00:47 to 06:47
    # in Miyazaki (15:47-21:47 UTC). sent.log makes sure only one page goes out.
    - cron: "47 15-21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to send (YYYY-MM-DD). Leave blank for today in Japan."
        required: false

permissions:
  contents: write   # to record sent pages in sent.log

concurrency: morning-page

jobs:
  send:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check if today's page is due
        id: due
        run: |
          DAY="${{ github.event.inputs.date }}"
          DAY="${DAY:-$(TZ=Asia/Tokyo date +%F)}"
          if [ -f "days/$DAY.json" ] && ! grep -qx "$DAY" sent.log 2>/dev/null; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to send for $DAY."
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.send == 'true'
        with:
          python-version: "3.12"

      - name: Install tools
        if: steps.due.outputs.send == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf fonts-noto-cjk poppler-utils
          pip install --quiet pypdf
          curl -sSL https://github.com/ddvk/rmapi/releases/download/v0.0.35/rmapi-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin rmapi
          rmapi version || true

      - name: Build and send
        if: steps.due.outputs.send == 'true'
        env:
          RMAPI_CONFIG_CONTENT: ${{ secrets.RMAPI_CONFIG }}
        run: |
          if [ -z "$RMAPI_CONFIG_CONTENT" ]; then
            echo "::error::The RMAPI_CONFIG secret is not set. See README."
            exit 1
          fi
          export RMAPI_CONFIG="$RUNNER_TEMP/rmapi.conf"
          printf '%s\n' "$RMAPI_CONFIG_CONTENT" > "$RMAPI_CONFIG"
          ./send_page.sh "${{ github.event.inputs.date }}"

      - name: Record sent page
        if: steps.due.outputs.send == 'true'
        run: |
          if [ -z "$(git status --porcelain -- sent.log)" ]; then
            echo "Nothing new to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.log
          git commit -m "Sent morning page"
          git push
